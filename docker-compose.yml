version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-school_user}:${POSTGRES_PASSWORD:-change_me_in_prod}@db:5432/${POSTGRES_DB:-school_erp}}
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_secure_random_secret_in_production}
      - TRUST_PROXY=${TRUST_PROXY:-True}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-school_erp}
      - POSTGRES_USER=${POSTGRES_USER:-school_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me_in_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-school_user} -d $${POSTGRES_DB:-school_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:

